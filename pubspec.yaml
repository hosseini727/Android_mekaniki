name: kargah_yar
description: GearPilot — سیستم مدیریت تعمیرگاه
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: any
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.0
  image_picker: ^1.1.2
  image: ^4.5.4
  google_mlkit_text_recognition: ^0.15.0
  tesseract_ocr: ^0.5.0
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.3.7
  workmanager: ^0.9.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/tessdata_config.json
    - assets/tessdata/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
